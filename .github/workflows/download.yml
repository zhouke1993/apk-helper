name: download-apk
on:
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Android package names, comma separated'
        default: 'com.microsoft.teams,com.microsoft.office.outlook'
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - name: Download and convert to apks
        run: |
          git clone --depth 1 https://github.com/codewithwan/apkpure-downloader.git
          cd apkpure-downloader
          python3 -m pip install -q -e . 2>&1 | tail -1
          IFS=',' read -ra PKGS <<< "${{ github.event.inputs.pkg }}"
          for P in "${PKGS[@]}"; do
            echo "=== downloading $P ==="
            apkpure-dl "$P" 2>&1 | tail -2
          done
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "=== convert xapk to apks ==="
          find . -name "*.xapk" -print0 | while IFS= read -r -d '' X; do
            D="${X%.xapk}_dir"
            mkdir -p "$D"
            unzip -o -q "$X" -d "$D"
            BASE=$(basename "$X" .xapk | tr ' :*' '____')
            (cd "$D" && zip -0 -q "$GITHUB_WORKSPACE/out/${BASE}.apks" base.apk split_*.apk)
            echo "converted: ${BASE}.apks"
          done
          echo "=== collect single apks ==="
          find . -name "*.apk" ! -name "base.apk" ! -name "split_*" -print0 | while IFS= read -r -d '' F; do
            B=$(basename "$F" | tr ' :*' '____')
            mv "$F" "$GITHUB_WORKSPACE/out/${B}"
            echo "collected: ${B}"
          done
          cd "$GITHUB_WORKSPACE/out"
          echo "=== final ==="; ls -la; sha256sum *
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-out
          path: out/*
          if-no-files-found: error
