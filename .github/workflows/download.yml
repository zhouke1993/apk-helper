name: download-apk
on:
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Android package name'
        default: 'com.veritickets.android'
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download via apkpure-dl
        run: |
          git clone --depth 1 https://github.com/codewithwan/apkpure-downloader.git
          cd apkpure-downloader
          python3 -m pip install -q -e . 2>&1 | tail -1
          apkpure-dl "${{ github.event.inputs.pkg }}" 2>&1 | tail -3
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . -type f \( -name "*.xapk" -o -name "*.apk" \) -print0 | while IFS= read -r -d '' F; do cp -v "$F" "$GITHUB_WORKSPACE/out/"; done
      - name: Merge XAPK and sign
        run: |
          cd "$GITHUB_WORKSPACE/out"
          XAPK=$(find . -maxdepth 1 -name "*.xapk" | head -1)
          if [ -n "$XAPK" ]; then
            curl -sL -o APKEditor.jar "https://github.com/REAndroid/APKEditor/releases/download/V1.4.4/APKEditor-1.4.4.jar"
            curl -sL -o uber-apk-signer.jar "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
            java -jar APKEditor.jar m -i "$XAPK" -o merged.apk
            java -jar uber-apk-signer.jar -a merged.apk --allowResign --out signed_out
            SIGNED=$(find signed_out -name "*.apk" | head -1)
            mv "$SIGNED" "final-signed.apk"
          fi
          find . -maxdepth 1 -type f ! -name "*.jar" -delete
          echo "=== final ==="; ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-out
          path: out/*
          if-no-files-found: error
