name: download-apk
on:
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Android package name'
        default: 'com.veritickets.android'
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - name: Download via apkpure-dl
        run: |
          git clone --depth 1 https://github.com/codewithwan/apkpure-downloader.git
          cd apkpure-downloader
          python3 -m pip install -q -e . 2>&1 | tail -1
          mkdir -p "$GITHUB_WORKSPACE/out"
          apkpure-dl "${{ github.event.inputs.pkg }}" 2>&1 | tee dl.log
          find . -type f \( -name "*.xapk" -o -name "*.apk" \) -print0 | while IFS= read -r -d '' F; do cp -v "$F" "$GITHUB_WORKSPACE/out/"; done
          ls -la "$GITHUB_WORKSPACE/out"
          sha256sum "$GITHUB_WORKSPACE/out"/* || true
      - name: Create release
        if: hashFiles('out/*') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/out"
          gh release create dl-"$GITHUB_RUN_ID" *.apk *.xapk 2>/dev/null || gh release create dl-"$GITHUB_RUN_ID" *.apk || gh release create dl-"$GITHUB_RUN_ID" *.xapk
          gh release view dl-"$GITHUB_RUN_ID" --json assets
