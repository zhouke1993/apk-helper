name: download-apk
on:
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Android package names, comma separated'
        default: 'com.microsoft.teams,com.microsoft.office.outlook'
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - name: Download and convert to apks
        run: |
          git clone --depth 1 https://github.com/codewithwan/apkpure-downloader.git
          cd apkpure-downloader
          python3 -m pip install -q -e . 2>&1 | tail -1
          IFS=',' read -ra PKGS <<< "${{ github.event.inputs.pkg }}"
          for P in "${PKGS[@]}"; do
            echo "=== downloading $P ==="
            apkpure-dl "$P" 2>&1 | tail -4
          done
          echo "=== convert xapk to apks ==="
          for X in *.xapk; do
            [ -e "$X" ] || continue
            D="${X%.xapk}_dir"
            mkdir -p "$D"
            unzip -o -q "$X" -d "$D"
            OUT="$(echo "${X%.xapk}" | tr ':' '_').apks"
            (cd "$D" && zip -0 -q "../$OUT" base.apk split_*.apk)
          done
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in *.apks; do [ -e "$f" ] && mv "$f" "$GITHUB_WORKSPACE/out/"; done
          for f in *.apk; do
            [ -e "$f" ] || continue
            case "$f" in base.apk|split_*) ;; *) mv "$f" "$GITHUB_WORKSPACE/out/";; esac
          done
          cd "$GITHUB_WORKSPACE/out"
          echo "=== final ==="; ls -la; sha256sum * || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-out
          path: out/*
          if-no-files-found: error
