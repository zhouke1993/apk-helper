name: download-apk
on:
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Android package names, comma separated'
        default: 'com.microsoft.teams,com.microsoft.office.outlook'
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - name: Download and convert to apks
        run: |
          git clone --depth 1 https://github.com/codewithwan/apkpure-downloader.git
          cd apkpure-downloader
          python3 -m pip install -q -e . 2>&1 | tail -1
          IFS=',' read -ra PKGS <<< "${{ github.event.inputs.pkg }}"
          for P in "${PKGS[@]}"; do
            echo "=== downloading $P ==="
            apkpure-dl "$P" 2>&1 | tail -4
          done
          echo "=== convert xapk to apks ==="
          for X in *.xapk; do
            [ -e "$X" ] || continue
            D="${X%.xapk}_dir"; mkdir -p "$D"; unzip -o -q "$X" -d "$D"
            OUT="${X%%:*}.apks"
            python3 -c "
import zipfile, glob, os
d = r'$D'
out = r'$OUT'
files = ['base.apk'] + sorted(os.path.basename(f) for f in glob.glob(os.path.join(d, 'split_*.apk')))
with zipfile.ZipFile(out, 'w', zipfile.ZIP_STORED) as z:
    for f in files:
        p = os.path.join(d, f)
        if os.path.exists(p):
            z.write(p, f)
        else:
            print('MISSING', f)
print('created', out)
"
          done
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in *.apks; do [ -e "$f" ] && mv "$f" "$GITHUB_WORKSPACE/out/"; done
          for f in *.apk; do
            [ -e "$f" ] || continue
            case "$f" in base.apk|split_*) ;; *) mv "$f" "$GITHUB_WORKSPACE/out/";; esac
          done
          cd "$GITHUB_WORKSPACE/out"
          for f in *:*; do [ -e "$f" ] && mv "$f" "$(echo "$f" | tr ':' '_')"; done
          echo "=== final ==="; ls -la; sha256sum * || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-out
          path: out/*
          if-no-files-found: error
